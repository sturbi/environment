# --- Schriftart & Grundeinstellungen ---
font_family      Hack Nerd Font Propo
font_size        14.0
scrollback_lines 10000
allow_remote_control yes

term xterm-256color

# --- Bell ---
enable_audio_bell no

# --- Layouts ---
enabled_layouts splits, grid, stack

# --- Permanente Statusleiste (Powerlevel10k Classic) ---
tab_bar_min_tabs 1
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style angled
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title[:20]}{'…' if len(title) > 20 else ''}"
tab_bar_background #272822
active_tab_foreground #eeeeee
active_tab_background #0087af
active_tab_font_style bold
inactive_tab_foreground #949494
inactive_tab_background #444444
inactive_tab_font_style normal

# --- Farben (Monokai-Stil) ---
background            #272822
foreground            #d0d0d0
selection_background  #49483e
selection_foreground  #f8f8f2

color0 #272822
color1 #f92672
color2 #a6e22e
color3 #f4bf75
color4 #66d9ef
color5 #ae81ff
color6 #a1efe4
color7 #f8f8f2

# --- Maus & Kopieren/Einfügen ---
# Rechtsklick fügt den kopierten Text sofort ein
mouse_map right press ungrabbed paste_from_clipboard

# --- Tastaturkürzel ---
# Horizontal split (Neues Fenster UNTEN dranhängen)
map ctrl+shift+o launch --location=hsplit

# Vertikal split (Neues Fenster RECHTS dranhängen)
map ctrl+shift+e launch --location=vsplit

# Fenster im Grid anordnen (Standard-Neufenster)
map ctrl+shift+enter new_window

# Tabs direkt über ihre Nummer anspringen
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9
map ctrl+shift+0 goto_tab 10

# Zwischen Fenstern mit den Pfeiltasten wechseln
map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down

# Geteiltes Layout um 90 Grad drehen
map super+r layout_action rotate

# Broadcast-Fenster für den aktuellen Tab unten öffnen
map alt+a launch --location=hsplit --bias=15 --allow-remote-control kitty +kitten broadcast --match-tab state:focused

